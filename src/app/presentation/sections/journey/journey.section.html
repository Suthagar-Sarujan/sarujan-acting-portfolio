<section class="section" id="journey">
  <div class="wrap narrow">
    <h2 class="title center" appReveal>My <em>Journey</em></h2>
    <div class="timeline">
      @for (m of milestones(); track $index) {
        <div class="tl" appReveal><b>{{ m.year }}</b><h3>{{ m.title }}</h3><p>{{ m.text }}</p></div>
      }
    </div>
  </div>
</section>
