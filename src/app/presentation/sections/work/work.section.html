<section class="section" id="work">
  <div class="wrap">
    <h2 class="title center" appReveal>What I'm <em>doing</em> now</h2>
    <div class="now-grid">
      @for (n of now(); track n.title) {
        <div class="now" appReveal><span class="icon"><app-icon [name]="n.icon" /></span><h3>{{ n.title }}</h3><p>{{ n.text }}</p></div>
      }
    </div>
    <h2 class="title center sub" appReveal>Selected <em>Work</em></h2>
    <div class="work-grid">
      @for (w of work(); track $index) {
        <article class="card" appReveal [appBgImage]="w.image">
          <div><small>{{ w.type }} · {{ w.year }}</small><h3>{{ w.title }}</h3><p>Role: {{ w.role }}</p></div>
        </article>
      }
    </div>
  </div>
</section>
