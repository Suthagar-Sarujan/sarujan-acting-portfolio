<section class="hero" id="home">
  <div class="hero-bg" [appBgImage]="data().heroImage"></div>
  @if (data().heroVideo; as video) {
    <video class="hero-video" [src]="video" [muted]="true" muted autoplay loop playsinline preload="auto"
           (error)="$any($event.target).style.display = 'none'"></video>
  }
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <p class="eyebrow" appReveal>{{ data().role }}</p>
    <h1 appReveal>{{ data().name }}</h1>
    <p class="tagline" appReveal>{{ data().tagline }}</p>
    <div class="hero-actions" appReveal>
      <a href="#showreel" class="btn primary">▶ Watch Showreel</a>
      <a href="#contact" class="btn ghost">Get in touch</a>
    </div>
  </div>
  <a href="#about" class="scroll-hint" aria-label="Scroll down"><span></span></a>
</section>
